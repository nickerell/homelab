---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.k3s.io/name: esphome
  name: esphome-config-pvc
  namespace: home-assistant
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: esphome
  namespace: home-assistant
spec:
  ports:
    - port: 6052
  selector:
    app.k3s.io/name: esphome
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.k3s.io/name: esphome
  name: esphome
spec:
  replicas: 1
  selector:
    matchLabels:
      app.k3s.io/name: esphome
  template:
    metadata:
      labels:
        app.k3s.io/name: esphome
    spec:
      containers:
        - name: esphome
          image: ghcr.io/esphome/esphome:latest
          command: ["dashboard", "/config"]
          ports:
            - containerPort: 6052
          volumeMounts:
            - name: esphome-config
              mountPath: /config
      volumes:
        - name: esphome-config
          persistentVolumeClaim:
            claimName: esphome-config-pvc
