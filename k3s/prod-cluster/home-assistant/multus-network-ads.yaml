---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: iot-vlan3-network
  namespace: home-assistant
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "iot-vlan3-network",
      "plugins": [
        {
          "type": "bridge",
          "bridge": "br-iot",
          "ipam": {
            "type": "dhcp"
          }
        },
        {
          "type": "sbr"
        }
      ]
    }
---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: main-vlan-network
  namespace: home-assistant
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "plugins": [
        {
          "type": "macvlan",
          "master": "eno1",
          "mode": "bridge",
          "ipam": {
            "type": "dhcp"
          }
        },
        {
          "type": "sbr"
        }
      ]
    }
