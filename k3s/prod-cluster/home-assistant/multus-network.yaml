---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: iot-vlan3-network
  namespace: home-assistant 
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "iot-vlan3-network",
      "plugins": [
        {
          "type": "macvlan",
          "mode": "bridge",
          "master": "eno1",
          "vlan": 3,
          "ipam": {
            "type": "dhcp"
          }
        },
        { "type": "sbr" }
      ]
    }

