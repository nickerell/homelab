---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    app: homeassistant
  name: home-assistant
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: homeassistant
  name: homeassistant-pvc
  namespace: home-assistant
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  namespace: home-assistant
  annotations:
    external-dns.alpha.kubernetes.io/hostname: ha.home
    external-dns.alpha.kubernetes.io/target: 10.1.1.177
spec:
  ports:
    - name: "8123"
      port: 8123
      protocol: TCP
  selector:
    app: homeassistant
  type: LoadBalancer
  externalIPs:
    - 10.1.1.177
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: homeassistant
  name: homeassistant
  namespace: home-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homeassistant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: homeassistant
      annotations:
        k8s.v1.cni.cncf.io/networks: '[
          { 
            "name" : "iot-vlan3-network", 
            "mac": "8a:8a:b5:ce:04:33" 
          },
          {
            "name" : "main-vlan-network", 
            "mac": "8a:8a:b5:ce:04:11" 
          }
        ]'
    spec:
      containers:
        - image: ghcr.io/home-assistant/home-assistant:2026.11.0
          imagePullPolicy: Always
          name: homeassistant
          ports:
            - containerPort: 8123
              protocol: TCP
          securityContext:
            privileged: true
          env:
            - name: TZ
              value: "America/Chicago"
          volumeMounts:
            - mountPath: /etc/localtime
              name: tz-config
              readOnly: true
            - mountPath: /config
              name: ha-data-volume
      restartPolicy: Always
      volumes:
        - name: tz-config
          hostPath:
            path: /usr/share/zoneinfo/America/Chicago
        - name: ha-data-volume
          persistentVolumeClaim:
            claimName: homeassistant-pvc
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homeassistant
  namespace: home-assistant
  labels:
    app: homeassistant
  annotations:
    external-dns.alpha.kubernetes.io/target: 10.1.1.177
    traefik.ingress.kubernetes.io/router.middlewares: home-assistant-strip-proxy-headers@kubernetescrd
    cert-manager.io/cluster-issuer: homelab-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ha.home
      secretName: homeassistant-tls
  rules:
    - host: ha.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homeassistant
                port:
                  number: 8123
